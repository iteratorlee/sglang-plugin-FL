# SGLang-FL Dispatch Configuration for Ascend NPU
prefer: flagos

# Ascend correctness profile for FlagGems master 855774a (2026-09-04).
# Full-kernel A/B validation on Qwen3-0.6B found cross-token semantic drift in
# the broad replacement set, while ``ones`` was graph/eager deterministic.
# Use an allowlist so newly added, unvalidated FlagGems kernels stay disabled
# automatically.  Layer 2 fused FlagGems/Ascend kernels remain enabled via OOT
# dispatch; this setting only narrows Layer 1 ATen replacement.
flagos_whitelist:
  - ones

# Legacy denylist retained for deployments that explicitly override the safe
# allowlist with SGLANG_FL_FLAGOS_BLACKLIST.  Under the default profile the
# allowlist above takes precedence and this list is not consulted.
#   addmm  : F.linear with bias decomposes to aten.addmm even when "linear" is
#            blacklisted. FlagGems v5.3.0's Ascend addmm kernel masks only K, not
#            the M/N tail tiles; Qwen3-VL vision projection therefore triggers an
#            AICore MTE DDR out-of-range fault during autotuning. Route addmm to
#            torch_npu until the upstream kernel adds complete boundary masks.
# conv1d was already in main's list (it stays); it is needed because the flag_gems
# triton conv1d/conv2d autotuner crashes (aicore exception) on Qwen3.6-35B-A3B
# causal_conv1d shapes.
flagos_blacklist:
  - full_like
  - index_copy_
  - gather
  - count_nonzero
  - index_put_
  - _index_put_impl_
  - cumsum
  - fill_scalar_
  - argmax
  - index
  - add_
  - conv1d
  - floor_divide
  - true_divide_
  - addmm
  # FlagGems master (855774a, 2026-09-04) generates an invalid Ascend Triton
  # kernel for scalar ** tensor while SGLang builds the RoPE cache.  The
  # generated kernel assigns tl.store's None return value to a tensor.  The
  # blacklist API matches implementation function names rather than the ATen
  # family name, so exclude every pow implementation explicitly.
  - pow_scalar
  - pow_tensor_scalar
  - pow_tensor_tensor
  - pow_tensor_scalar_
  - pow_tensor_tensor_
  # GLM-5.3 builds a 1M-token RoPE cache.  FlagGems master arange selects an
  # invalid zero-core launch for this construction on 910C.
  # FlagGems records the overload implementation as ``arange_start``.  Keep
  # both names so the guard remains effective if upstream changes the wrapper.
  - arange
  - arange_start
  # GLM-5.3 KDA uses non-contiguous views and an FP32 triangular solve.  The
  # FlagGems implementations are numerically unsafe for these state updates;
  # route them to torch-npu (validated by the vendor's KDA reference cases).
  - exp2
  - linalg_solve_triangular

# OOT dispatch blacklist (sglang op CLASS names, not ATen op names): none needed.
# MRotaryEmbedding was listed pre-verification but confirmed UNNECESSARY: with
# attention_backend="ascend", the flagos mrotary path produces correct output
# (Qwen3.6-27B verified 2026-08-07: "50"/"Paris" + VL all correct). The earlier
# "5254" was caused by the missing attention_backend, NOT by flagos mrotary.
# Do NOT re-add MRotaryEmbedding here without first re-checking attention_backend.
# (When this key is absent the plugin defaults to oot_blacklist = [].)
