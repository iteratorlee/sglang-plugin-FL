# SGLang-FL Dispatch Configuration for Ascend NPU
prefer: flagos

# FlagGems remains enabled, but the 2026-09-04 Ascend validation found semantic
# errors in Qwen3-0.6B with the broad ATen replacement set and a compile-time UB
# overflow in Hy4's mean reduction. Keep a conservative, measured-safe Layer-1
# surface by default. ``ones`` was verified in eager and CUDA-graph modes while
# FlagOS OOT kernels (RMSNorm/rotary/SiluAndMul) remain independently enabled.
# Operators can be widened explicitly with SGLANG_FL_FLAGOS_WHITELIST after
# model-specific accuracy validation.
flagos_whitelist:
  - ones

# OOT dispatch blacklist (sglang op CLASS names, not ATen op names).
# MRotaryEmbedding was listed pre-verification but confirmed UNNECESSARY: with
# attention_backend="ascend", the flagos mrotary path produces correct output
# (Qwen3.6-27B verified 2026-08-07: "50"/"Paris" + VL all correct). The earlier
# "5254" was caused by the missing attention_backend, NOT by flagos mrotary.
# Do NOT re-add MRotaryEmbedding here without first re-checking attention_backend.
oot_blacklist:
  # FlagOS TopK still expects TopKConfig.topk, while SGLang 0.5.11 exposes
  # top_k. Use the native Ascend implementation without exception fallback.
  - TopK
